<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Planta da Casa</title>
<meta name="theme-color" content="#2c6e49" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header">
  <h1>Planta da Casa</h1>
</header>

<nav class="tab-bar">
  <button type="button" class="tab-button active" data-target="floor-plan">Planta Baixa</button>
  <button type="button" class="tab-button" data-target="wall-1">Parede 1</button>
  <button type="button" class="tab-button" data-target="wall-2">Parede 2</button>
</nav>

<main>
  <section id="floor-plan" class="tab-panel active">
    <div class="canvas-wrap">
      <canvas id="floor-plan-canvas"></canvas>
    </div>
    <div id="toolbox" class="toolbox"></div>
    <div id="action-bar" class="action-bar">
      <button type="button" id="btn-rotate-left" title="Girar para a esquerda">↺</button>
      <button type="button" id="btn-rotate-right" title="Girar para a direita">↻</button>
      <button type="button" id="btn-scale-down" title="Diminuir">−</button>
      <button type="button" id="btn-scale-up" title="Aumentar">+</button>
      <button type="button" id="btn-remove" class="danger" title="Remover">🗑 Remover</button>
    </div>
    <button type="button" id="btn-clear" class="clear-all">Limpar todos os móveis</button>
  </section>

  <section id="wall-1" class="tab-panel">
    <div class="canvas-wrap">
      <canvas id="wall-1-canvas"></canvas>
    </div>
    <p class="hint">Vista de referência da parede (somente visualização).</p>
  </section>

  <section id="wall-2" class="tab-panel">
    <div class="canvas-wrap">
      <canvas id="wall-2-canvas"></canvas>
    </div>
    <p class="hint">Vista de referência da parede (somente visualização).</p>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
